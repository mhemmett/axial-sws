# output.cfg — HDF5 output (PyLith 5 syntax)
# Material observer renamed elastic -> crust (poroelastic upgrade) and extended
# with poroelastic fields (pressure, porosity, bulk_density).

[pylithapp.problem]
solution_observers = [domain]

[pylithapp.problem.solution_observers.domain]
writer.filename = output/solution.h5

[pylithapp.problem.materials.crust.observers.observer]
writer.filename = output/material_crust.h5
data_fields = [cauchy_stress, cauchy_strain, displacement, pressure, trace_strain, porosity, bulk_density, isotropic_permeability]

# NOTE: fault observers live in cfg/faults.cfg (not here) so the no-fault Pass-1
# stack — which omits faults.cfg — does not reference nonexistent interfaces.
