# dike.cfg — FaultCohesiveKin for the real multi-segment dike (Baillard/session
# geometry -- see mesh/generate_mesh.py's module docstring for the 5-waypoint path).
# Kept SEPARATE from cfg/faults.cfg (ring faults) so scripts/run_sweep.py's Pass 1 can
# activate the dike alone (interfaces=[dike1,dike2,dike3,dike4]) without the ring faults
# -- see faults.cfg's header comment for why this split is required (PyLith's
# `interfaces` facility-array validation rejects configuring a fault name that isn't in
# the active list).
#
# FOUR SEPARATE interfaces, not one merged "dike" interface: the path has two sharp
# junctions (P1: ~10 deg interior angle, effectively a fold-back; P2: 80 deg corner).
# Treating all 4 segments as ONE continuous FaultCohesiveKin interface crashed PyLith's
# automatic cohesive-cell insertion ("Invalid cohesive label", DMPlexLabelCohesiveCheck)
# exactly at those two junctions -- confirmed via the error log's "Impinging point"
# warnings and the fatal error both localized to P1's/P2's coordinates. Each segment here
# is an independent, purely planar interface, so no junction topology is ever built.
#
# Pure-opening (tensile) interfaces: only final_slip_opening is ever set nonzero, unlike
# the ring faults' reverse-slip convention. All 4 are buried (don't reach the domain
# boundary) -> edge/edge_value required. Placeholder 0.0*m opening below, overridden per
# scenario by run_sweep.py (same value applied uniformly to all 4 segments there).
#
# SIMPLIFIED BACK TO THE DEFAULT KinSrcStep (instantaneous, whole-structure opening in
# one quasi-static step -- pylithapp.cfg's default start_time=-1yr/end_time=0yr/
# initial_dt=1yr IS a single step), per explicit user direction (2026-07-23): don't model
# the dike opening as evolving/propagating in time at all -- just step the whole
# structure (all 4 segments, south to north) in at once. An earlier KinSrcRamp-based
# multi-step approach was tried (to avoid an instantaneous-jump convergence failure) and
# got the ramp itself working, but then hit a SEPARATE, reproducible divergence on the
# run's LAST time step specific to having 4 separate fault interfaces (confirmed
# independent of ramp/rise-time placement via a diagnostic run) -- an unresolved solver/
# preconditioner issue, not a ramp-timing one. Reverting to instantaneous KinSrcStep
# sidesteps that specific problem by removing the multi-step time integration entirely;
# whether a single instantaneous 2m jump itself converges with 4 separate interfaces
# (it previously diverged with ONE merged interface) is being tested fresh.
#
# ref_dir_2 (along-strike unit vector, [sin(az), cos(az), 0]) differs per segment since
# each has its own azimuth: dike1 az180 (south), dike2 az350, dike3 az270 (west), dike4
# az30 (N-NE) -- see mesh/generate_mesh.py's DIKE_WAYPOINTS for the geometry these match.

[pylithapp.problem.interfaces.dike1]
label       = dike1
label_value = 40
edge        = dike1_edge
edge_value  = 140
ref_dir_1   = [0.0, 0.0, 1.0]
ref_dir_2   = [0.0, -1.0, 0.0]
eq_ruptures = [rupture]
observers.observer.data_fields = [slip, traction_change]
observers.observer.writer.filename = output/dike1.h5

[pylithapp.problem.interfaces.dike1.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Instantaneous opening, dike segment 1 (P0->P1)
db_auxiliary_field.values = [initiation_time, final_slip_left_lateral, final_slip_reverse, final_slip_opening]
db_auxiliary_field.data   = [0.0*s, 0.0*m, 0.0*m, 0.0*m]

