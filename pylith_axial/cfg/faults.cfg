# faults.cfg — FaultCohesiveKin for the eastern/western ring faults ONLY.
# The Okada dike is defined separately in dike.cfg, NOT here -- PyLith treats
# `interfaces = [...]` as an exhaustive facility-array declaration: any cfg file
# that configures a fault name (fault_east.xxx etc.) not currently listed in
# `interfaces` is a hard configuration error ("unknown component"), not a silent
# no-op. Since scripts/run_sweep.py's Pass 1 needs to activate the dike WITHOUT
# the ring faults (interfaces=[dike]), the ring faults and the dike must live in
# separate cfg files so Pass 1's cfg stack can include dike.cfg while omitting
# this file entirely (mirroring how the ring faults were always excluded from
# Pass 1 by omitting this file before the dike existed).
#
# Both faults are buried (don't reach domain boundary) → edge/edge_value required.
#
# Slip convention (PyLith right-hand rule):
#   final_slip_left_lateral : along-strike (positive = left-lateral)
#   final_slip_reverse      : up-dip       (positive = reverse/thrust)
#   final_slip_opening      : fault-normal  (positive = tensile opening)
#
# Normal faulting during inflation: hanging wall drops → negative reverse slip.
# Values below are placeholders overridden per scenario by run_sweep.py.

[pylithapp.problem.interfaces.fault_east]
label       = fault_east
label_value = 20
edge        = fault_east_edge
edge_value  = 120
ref_dir_1   = [0.0, 0.0, 1.0]
ref_dir_2   = [0.866, 0.5, 0.0]
eq_ruptures = [rupture]
observers.observer.data_fields = [slip, traction_change]
observers.observer.writer.filename = output/fault_east.h5

[pylithapp.problem.interfaces.fault_east.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Kinematic slip eastern ring fault
db_auxiliary_field.values = [initiation_time, final_slip_left_lateral, final_slip_reverse, final_slip_opening]
db_auxiliary_field.data   = [0.0*s, 0.0*m, -0.5*m, 0.0*m]

[pylithapp.problem.interfaces.fault_west]
label       = fault_west
label_value = 21
edge        = fault_west_edge
edge_value  = 121
ref_dir_1   = [0.0, 0.0, 1.0]
ref_dir_2   = [-0.866, -0.5, 0.0]
eq_ruptures = [rupture]
observers.observer.data_fields = [slip, traction_change]
observers.observer.writer.filename = output/fault_west.h5

[pylithapp.problem.interfaces.fault_west.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Kinematic slip western ring fault
db_auxiliary_field.values = [initiation_time, final_slip_left_lateral, final_slip_reverse, final_slip_opening]
db_auxiliary_field.data   = [0.0*s, 0.0*m, -0.5*m, 0.0*m]
