# bc.cfg — Boundary conditions (POROELASTIC)
#
# Mechanical:
#   Domain side/bottom walls: zero normal displacement (roller Dirichlet).
# Hydraulic:
#   Seafloor (top, boundary_zpos tag 15): pressure = 0 (free drainage at the
#     seafloor — fluid can escape to the ocean).
#   Mogi cavity wall (mogi_deep tag 30): prescribed fluid pressure (Dirichlet on
#     the pressure field). This is the physically correct way to drive inflation
#     in a poroelastic model — fluid pressure is injected into the cavity, which
#     poroelastically stresses the surrounding crust (replaces the old mechanical
#     Neumann wall traction). Amplitude is set per scenario by run_sweep.py.
#   Lateral/bottom walls: no explicit flux BC -> PyLith's natural (zero-flux,
#     no-flow) condition applies, which is the desired closed boundary.

# ── Mechanical roller walls (constrain normal displacement) ───────────────────
[pylithapp.problem.bc.bc_xneg]
label = boundary_xneg
label_value = 10
constrained_dof = [0]
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Zero displacement xneg

[pylithapp.problem.bc.bc_xpos]
label = boundary_xpos
label_value = 11
constrained_dof = [0]
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Zero displacement xpos

[pylithapp.problem.bc.bc_yneg]
label = boundary_yneg
label_value = 12
constrained_dof = [1]
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Zero displacement yneg

[pylithapp.problem.bc.bc_ypos]
label = boundary_ypos
label_value = 13
constrained_dof = [1]
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Zero displacement ypos

[pylithapp.problem.bc.bc_zneg]
label = boundary_zneg
label_value = 14
constrained_dof = [2]
field = displacement
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Zero displacement zneg

# ── Hydraulic: free drainage at the seafloor ──────────────────────────────────
# boundary_zpos (tag 15) is the seafloor / free surface. Constrain pressure = 0
# so excess pore pressure drains to the ocean.
[pylithapp.problem.bc.bc_seafloor]
label = boundary_zpos
label_value = 15
constrained_dof = [0]
field = pressure
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Free drainage (zero pore pressure) at seafloor

# ── Deep Mogi source S1 — fluid pressure injection (Dirichlet on pressure) ────
# initial_amplitude is the fluid overpressure injected at the cavity wall.
# Set per scenario by run_sweep.py (placeholder 0 MPa here).
[pylithapp.problem.bc.mogi_deep_bc]
label = mogi_deep
label_value = 30
constrained_dof = [0]
field = pressure
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Deep Mogi source S1 — injected fluid pressure
db_auxiliary_field.values = [initial_amplitude]
db_auxiliary_field.data   = [0.0*MPa]
auxiliary_subfields.initial_amplitude.basis_order = 0
