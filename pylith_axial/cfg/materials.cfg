# materials.cfg — Isotropic linear poroelastic crust (two depth layers)
#
# Switched from IsotropicLinearElasticity to Poroelasticity +
# IsotropicLinearPoroelasticity (physics upgrade).
#
# Properties are depth-dependent via a SimpleGridDB:
#   Upper edifice (top 100 m, z in [0.0, 0.1] km): porosity 0.265,
#     Biot 0.6, permeability 1e-12 m^2 (highly fractured young seafloor).
#   MORB crust (z < 0.0 km): porosity 0.05, Biot 0.4, permeability 1e-15 m^2.
# Shared: solid_density 2900 kg/m^3, shear_modulus 30 GPa,
#   drained_bulk_modulus 50 GPa (derived from existing Vp/Vs);
#   fluid_density 1050 kg/m^3, fluid_viscosity 1e-3 Pa*s,
#   fluid_bulk_modulus 2.25 GPa.
# See spatialdb/poroelastic_props.spatialdb for the actual values.

[pylithapp.problem]
materials = [crust]
materials.crust = pylith.materials.Poroelasticity

[pylithapp.problem.materials.crust]
bulk_rheology = pylith.materials.IsotropicLinearPoroelasticity

# label_value matches tag=1 in MaterialGroup (physical group "material-id:1")
label_value = 1

# Depth-dependent (two-layer) properties.
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = Layered poroelastic properties (upper edifice + MORB)
db_auxiliary_field.filename = spatialdb/poroelastic_props.spatialdb
db_auxiliary_field.query_type = nearest

# basis_order 0 for the (piecewise-uniform) input properties; 1 for derived
# stress/strain so they are reported at higher order in the output.
auxiliary_subfields.solid_density.basis_order   = 0
auxiliary_subfields.fluid_density.basis_order   = 0
auxiliary_subfields.fluid_viscosity.basis_order = 0
auxiliary_subfields.porosity.basis_order        = 0
derived_subfields.cauchy_stress.basis_order = 1
derived_subfields.cauchy_strain.basis_order = 1

[pylithapp.problem.materials.crust.bulk_rheology]
auxiliary_subfields.shear_modulus.basis_order          = 0
auxiliary_subfields.drained_bulk_modulus.basis_order   = 0
auxiliary_subfields.biot_coefficient.basis_order       = 0
auxiliary_subfields.biot_modulus.basis_order           = 0
auxiliary_subfields.isotropic_permeability.basis_order = 0
