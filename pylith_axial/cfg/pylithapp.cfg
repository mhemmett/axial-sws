# pylithapp.cfg — PyLith 5.x base configuration for Axial Seamount simulation
#
# PHYSICS UPGRADE: quasi-static POROELASTICITY (was isotropic linear elasticity).
#   - Solution:  SolnDispPresTracStrainLagrange (disp + pressure + trace_strain
#                + fault Lagrange multipliers) — required for poroelastic +
#                FaultCohesiveKin.
#   - Rheology:  Poroelasticity / IsotropicLinearPoroelasticity (materials.cfg).
#   - Inflation: fluid-pressure source into the Mogi cavity (bc.cfg), not a
#                mechanical wall traction.
#
# Two-pass stress-informed slip scheme is driven externally by
# scripts/run_sweep.py:
#   Pass 1 ("pre"):  no-fault inflation solve (solver_poroelasticity.cfg).
#   Pass 2 ("syn"):  full model with stress-derived prescribed slip
#                    (solver_poroelasticity_fault.cfg).
# This base file configures the FULL (with-fault) problem; Pass 1 overrides
# remove the interfaces and swap the solver.
#
# COORDINATES: the mesh (mesh/axial_seamount.msh) is built in KM. FIXED
# 2026-07-22 (was previously unset, so PyLith's reader interpreted the raw
# node coordinates as METRES, uniformly shrinking all geometry by 1000x --
# see git history for the prior version of this comment/reasoning). Setting
# reader.coordsys.units = km below tells the reader to properly scale the
# mesh by 1000x on read, matching the km convention already used by every
# spatialdb file in spatialdb/ (all declare to-meters=1.0e+3) and by the new
# deformation-field spatialdb files (scripts/convert_deformation_spatialdb.py).
#
# CONSEQUENCE OF THE FIX: this changes actual model behavior, not just a
# reporting/display correction. run_sweep.py / plot_stress_3d.py /
# visualize_sweep.py's STRESS_SCALE logic has been reconciled to match (see
# each script's own comment) but existing output/*.h5 sweep results and
# figures/ were generated under the OLD (unfixed) mesh scale and are STALE --
# they must be re-run/regenerated before being trusted or reused. Absolute
# displacement and permeability-length-dependent (poroelastic diffusion)
# behavior are the quantities most affected by the old bug; stress magnitude
# was argued to be invariant under the old uniform rescale for homogeneous/
# fixed-value BCs, so pre-fix stress-only conclusions are less at risk, but
# should still be re-verified against a post-fix re-run before being relied on.

[pylithapp.metadata]
description = Axial Seamount ring faults: poroelastic + fluid-source Mogi inflation, stress-informed slip
keywords = [axial seamount, ring faults, Mogi, poroelasticity, kinematic, shear-wave splitting]
arguments = [pylithapp.cfg, materials.cfg, faults.cfg, bc.cfg, output.cfg]
pylith_version = [>=5.0, <6.0]

[pylithapp.journal]
device = color-console

# ── Mesh ─────────────────────────────────────────────────────────────────────
[pylithapp.problem.mesh_initializer.phases.read_mesh]
reader = pylith.meshio.MeshIOPetsc
reader.filename = mesh/axial_seamount.msh
reader.coordsys.space_dim = 3
reader.coordsys.units = km

# ── Problem ───────────────────────────────────────────────────────────────────
[pylithapp.problem]
# SolnDispPresTracStrainLagrange: poroelastic solution subfields + fault
# Lagrange multipliers (FaultCohesiveKin).
solution = pylith.problems.SolnDispPresTracStrainLagrange
defaults.quadrature_order = 2
defaults.name = axial_mogi_fault

# Nondimensionalization for quasi-static poroelasticity.
scales = pylith.scales.QuasistaticPoroelasticity
scales.length_scale       = 1.0*km
scales.displacement_scale = 0.1*m
scales.shear_modulus      = 30.0*GPa
scales.viscosity          = 0.001*Pa*s
scales.permeability       = 1.0e-12*m**2

[pylithapp.problem.solution.subfields]
displacement.basis_order              = 2
pressure.basis_order                  = 1
trace_strain.basis_order              = 1
lagrange_multiplier_fault.basis_order = 2

[pylithapp.problem]
solution_observers = [domain]

# ── Time (quasi-static: single step; instantaneous undrained response) ────────
[pylithapp.problem]
initial_dt = 1.0*year
start_time = -1.0*year
end_time   = 0.0*year

# ── Materials ─────────────────────────────────────────────────────────────────
[pylithapp.problem]
materials = [crust]

# ── Faults ────────────────────────────────────────────────────────────────────
[pylithapp.problem]
interfaces = [fault_east, fault_west, dike1, dike2, dike3, dike4]

# ── Boundary conditions ───────────────────────────────────────────────────────
[pylithapp.problem]
bc = [bc_xneg, bc_xpos, bc_yneg, bc_ypos, bc_zneg, bc_seafloor, mogi_deep_bc]
bc.bc_xneg      = pylith.bc.DirichletTimeDependent
bc.bc_xpos      = pylith.bc.DirichletTimeDependent
bc.bc_yneg      = pylith.bc.DirichletTimeDependent
bc.bc_ypos      = pylith.bc.DirichletTimeDependent
bc.bc_zneg      = pylith.bc.DirichletTimeDependent
bc.bc_seafloor  = pylith.bc.DirichletTimeDependent
bc.mogi_deep_bc = pylith.bc.DirichletTimeDependent

# ── PETSc solver ──────────────────────────────────────────────────────────────
# Default solver here is the WITH-FAULT poroelastic field-split preconditioner
# (PyLith share/settings/solver_poroelasticity_fault.cfg). Pass 1 (no-fault)
# overrides this stack via run_sweep.py with solver_poroelasticity.cfg.
[pylithapp.petsc]
ts_type = beuler
pc_type = fieldsplit
pc_fieldsplit_type = multiplicative
pc_fieldsplit_0_fields = 2
pc_fieldsplit_1_fields = 1
pc_fieldsplit_2_fields = 0
pc_fieldsplit_3_fields = 3

fieldsplit_trace_strain_pc_type = bjacobi
fieldsplit_pressure_pc_type     = bjacobi

# Displacement sub-block: DIRECT solve (LU) instead of algebraic multigrid (ml).
# Viable for small, serial runs; far more robust/predictable here than AMG,
# which was extremely slow on this mesh under the km-as-m conditioning.
fieldsplit_displacement_pc_type  = lu
fieldsplit_displacement_ksp_type = preonly

fieldsplit_lagrange_multiplier_fault_pc_type = jacobi

dm_reorder_section = True
dm_reorder_section_type = cohesive

ksp_rtol   = 1.0e-10
ksp_atol   = 1.0e-12
ksp_max_it = 1000
snes_rtol  = 1.0e-10
snes_atol  = 1.0e-8
snes_max_it = 100
snes_monitor = true
ksp_converged_reason  = true
snes_converged_reason = true
